plugins {
    id "net.neoforged.moddev"
}

neoForge {
    neoFormVersion = neoform_version
}

dependencies {
    compileOnly "org.spongepowered:mixin:${mixin_version}"
    compileOnly "io.github.llamalad7:mixinextras-common:0.5.3"
}

sourceSets.test {
    compileClasspath += sourceSets.main.compileClasspath
    runtimeClasspath += sourceSets.main.compileClasspath
}

tasks.register("textBudgetRegression", JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = "me.noramibu.lumentooltips.tooltip.TextBudgetRegression"
    if (providers.gradleProperty("textFixture").isPresent()) {
        args providers.gradleProperty("textFixture").get()
    }
}

tasks.named("check") { dependsOn "textBudgetRegression" }
