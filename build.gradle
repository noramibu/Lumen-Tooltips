plugins {
    id "com.diffplug.spotless" version "8.10.1" apply false
    id "net.fabricmc.fabric-loom-remap" version "${fabric_loom_version}" apply false
    id "net.neoforged.moddev" version "${moddev_version}" apply false
}

allprojects {
    group = mod_group
    version = "${artifact_minecraft_version}-b${mod_version}"
}

subprojects {
    apply plugin: "java-library"
    apply plugin: "com.diffplug.spotless"

    base {
        archivesName = "lumen-tooltips-${project.name}"
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(java_version)
        }
        withSourcesJar()
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
        options.release = java_version.toInteger()
    }

    spotless {
        ratchetFrom "HEAD"
        java {
            target "src/main/java/**/*.java"
            palantirJavaFormat("2.71.0")
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    repositories {
        mavenCentral()
        maven {
            name = "Minecraft"
            url = "https://libraries.minecraft.net/"
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Fabric"
                    url = "https://maven.fabricmc.net/"
                }
            }
            filter {
                includeGroupAndSubgroups("net.fabricmc")
                includeGroup("fabric-loom")
            }
        }
        exclusiveContent {
            forRepository {
                maven {
                    name = "Sponge"
                    url = "https://repo.spongepowered.org/repository/maven-public"
                }
            }
            filter {
                includeGroupAndSubgroups("org.spongepowered")
            }
        }
        maven {
            name = "NeoForge"
            url = "https://maven.neoforged.net/releases"
        }
    }

    def startupWebhookKey = providers.gradleProperty("lumenStartupWebhookKey")
            .orElse(providers.environmentVariable("LUMEN_STARTUP_WEBHOOK_KEY")).getOrElse("")
    def activeWebhookKey = providers.gradleProperty("lumenActiveWebhookKey")
            .orElse(providers.environmentVariable("LUMEN_ACTIVE_WEBHOOK_KEY")).getOrElse("")

    processResources {
        def props = [
                mod_id: mod_id,
                mod_name: mod_name,
                loader_mod_version: mod_version,
                mod_group: mod_group,
                mod_author: mod_author,
                mod_license: mod_license,
                mod_description: mod_description,
                java_version: java_version,
                minecraft_version: minecraft_version,
                minecraft_version_range: minecraft_version_range,
                fabric_minecraft_version: fabric_minecraft_version,
                neoforge_version: neoforge_version,
                neoforge_version_range: neoforge_version_range,
                fabric_loader_version: fabric_loader_version,
                startup_webhook_key: startupWebhookKey,
                active_webhook_key: activeWebhookKey
        ]

        inputs.properties(props)
        filesMatching([
                "fabric.mod.json",
                "META-INF/neoforge.mods.toml",
                "*.mixins.json",
                "lumen_tooltips_webhook.json"
        ]) {
            expand(props)
        }
    }
}
